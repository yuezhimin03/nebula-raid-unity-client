name: ci

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Configure C++17 native plugin
        run: cmake -S native -B .artifacts/native-cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build C++17 native plugin
        run: cmake --build .artifacts/native-cmake --config Release
      - name: Native C++ behavior tests
        run: ctest --test-dir .artifacts/native-cmake -C Release --output-on-failure
      - name: Native C++ benchmark smoke test
        run: .artifacts/native-cmake/bin/nebula_native_benchmark${{ runner.os == 'Windows' && '.exe' || '' }} --entities 256 --ticks 20
      - name: Restore
        run: dotnet restore NebulaRaid.sln
      - name: Build
        run: dotnet build NebulaRaid.sln -c Release --no-restore
      - name: Behavior tests
        run: dotnet run --project tests/NebulaRaid.Tests/NebulaRaid.Tests.csproj -c Release --no-build
      - name: Console replay smoke test
        run: dotnet run --project src/NebulaRaid.Demo/NebulaRaid.Demo.csproj -c Release --no-build -- --ticks 200 --output .artifacts/ci-match.nrr
      - name: Benchmark smoke test
        run: dotnet run --project benchmarks/NebulaRaid.Benchmarks/NebulaRaid.Benchmarks.csproj -c Release --no-build -- --entities 128 --ticks 20
      - name: Managed/native interop smoke test (Windows)
        if: runner.os == 'Windows'
        run: dotnet run --project tests/NebulaRaid.NativeInterop.Tests/NebulaRaid.NativeInterop.Tests.csproj -c Release --no-build -- --library .artifacts/native-cmake/bin/NebulaNative.dll
      - name: Managed/native interop smoke test (Linux)
        if: runner.os == 'Linux'
        run: dotnet run --project tests/NebulaRaid.NativeInterop.Tests/NebulaRaid.NativeInterop.Tests.csproj -c Release --no-build -- --library .artifacts/native-cmake/bin/libNebulaNative.so
